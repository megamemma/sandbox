<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@500;800&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css">
  <title>Blog preview card</title>
</head>
<body>
  <main>
    <article class="card">
        <img src="./assets/images/illustration-article.svg" alt="" class="illustration-article">
        <a href="#" class="post-tag text-preset-3-extra-bold">Learning</a>
        <div class="card-text">
          <p class="date-published text-preset-3-medium">Published 21 Dec 2023</p>
          <h1 class="article-head text-preset-1">HTML & CSS foundations</h1>
          <p class="article-subhead text-preset-2">These languages are the backbone of every website, defining structure, content, and presentation.</p>
        </div>
        <div class="author-info">
          <img src="./assets/images/image-avatar.webp" alt="The photo of the author of the article" class="author-pfp">
          <a href="#" class="author-name text-preset-3-extra-bold">Greg Hooper</a>
        </div>
    </article>
  </main>  
</body>
</html>
