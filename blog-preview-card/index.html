<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  <title>Blog preview card</title>
</head>
<body>
  <main>
    <div class="card">
      <img src="./assets/images/illustration-article.svg" alt="" class="illustration-article">
      <button class="btn-tag">Learning</button>
      <div class="card-text">
        <p class="date-published">Published 21 Dec 2023</p>
        <h2 class="article-head">HTML & CSS foundations</h2>
        <p class="article-subhead">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </div>
      <div class="author-info">
        <img src="./assets/images/image-avatar.webp" alt="The photo of the author of the article" class="author-pfp">
        <a href="#" class="author-name">Greg Hooper</a>
      </div>
    </div>
  </main>  
</body>
</html>
