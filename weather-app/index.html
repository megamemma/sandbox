<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;400;600&display=swap">
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <main>
        <article class="weather-card">
            <div class="search-row">
                <form action="" class="search">
                    <input type="text" placeholder="Search city"
                    spellcheck="false">
                    <button type="button">
                        <img width="20" src="./assets/images/search.png" alt=""></img>
                    </button>
                </form>
            </div>

            <div class="toast"></div>
            
            <div class="main-info">
                <img width="130" class="weather-icon" src="./assets/images/clear.png"></img>
                <h1 class="degrees celsius">22°c</h1>
                <h2 class="city">Madrid</h2>
            </div>
            
            <div class="weather-stats">
                <div>
                    <img src="./assets/images/humidity.png"></img>
                    <div class="weather-stats-text">
                        <p class="stats-value humidity">53%</p>
                        <p>Humidity</p>
                    </div>
                </div>
   
                <div>
                    <img src="./assets/images/wind.png"></img>
                    <div class="weather-stats-text">
                        <p class="stats-value wind">5.66 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </article>
    </main>
</body>
</html>
