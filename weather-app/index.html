<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <script src="./script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <article class="weather-card">
            <div class="search-row">
                <form action="" class="search">
                    <input type="text" placeholder="Search city"
                    spellcheck="false">
                    <button type="submit">
                        <img width="20" src="./assets/images/search.png" alt=""></img>
                    </button>
                </form>
            </div>
            
            <div class="main-info">
                <img width="130" class="weather-icon" src="./assets/images/clear.png"></img>
                <h1 class="degrees celsius">22°c</h1>
                <h2 class="city">Bengaluru</h2>
            </div>
            
            <div class="weather-stats">
                <div>
                    <img src="./assets/images/humidity.png"></img>
                    <div class="weather-stats-text">
                        <p class="stats-value">53%</p>
                        <p>Humidity</p>
                    </div>
                </div>
   
                <div>
                    <img src="./assets/images/wind.png"></img>
                    <div class="weather-stats-text">
                        <p class="stats-value">5.66 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </article>
    </main>
</body>
</html>
