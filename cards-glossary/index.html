<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Cards / Карточки </title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <main>
        <!-- Scr. 1: Paste the words list -->
        <section id="paste">
            <p class="hint" lang="ru">Скопируй сюда слова с переводом (из списка)</p>
            <textarea id="input" placeholder="rely on - полагаться на &#10; fed up - сыт по горло"></textarea>
            <button class="primary" id="start-button">Start</button>
        </section>

        <!-- Scr. 2: Train the words -->
         <section id="train">
            <div class="card">Gargantuan</div>
            <div class="row hidden">
                <button class="yes-know"></button>
                <button class="no-forgot"></button>
            </div>
         </section>

         <div class="card green">sdf</div> <!--REMOVE 30, 31 L8ER-->
         <div class="card red">pfft</div>

         <!-- Scr. 3: Words done -->
          <section id="words-done">
            <div class="card">Done!</div>
            <button class="primary" id="repeat-quiz">Start over</button>
          </section>
    </main>
</body>
</html>
